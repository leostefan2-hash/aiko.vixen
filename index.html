<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aiko Vixen | AI Model</title>

<meta name="theme-color" content="#2a0c1c">
<meta property="og:title" content="Aiko Vixen">
<meta property="og:description" content="Come talk to me, baby 💋">
<meta property="og:image" content="profile.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wine: #2a0c1c;
    --plum: #4a1432;
    --rose: #ff5c8a;
    --peach: #ff8a5c;
    --blush: #ffe3ea;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Manrope", system-ui, sans-serif;
    color: var(--blush);
    background: var(--wine);
    padding: max(36px, env(safe-area-inset-top)) 20px max(36px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(42,12,28,.45) 0%, rgba(42,12,28,.92) 75%),
      url("background.jpg") center / cover no-repeat,
      radial-gradient(circle at 30% 10%, var(--plum), var(--wine) 70%);
  }
  main { width: 100%; max-width: 420px; text-align: center; }

  .avatar-wrap {
    position: relative; width: 200px; height: 200px; margin: 0 auto 22px;
    border-radius: 50%; padding: 4px;
    background: conic-gradient(from 200deg, var(--rose), var(--peach), #ffd1dc, var(--rose));
    box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 40px rgba(255,92,138,.45);
    animation: glow 4s ease-in-out infinite;
  }
  .avatar {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--wine);
  }
  .online {
    position: absolute; right: 16px; bottom: 14px; width: 22px; height: 22px;
    border-radius: 50%; background: #3ddc84; border: 4px solid var(--wine);
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 30px rgba(255,92,138,.35); }
    50%     { box-shadow: 0 18px 40px rgba(0,0,0,.5), 0 0 55px rgba(255,92,138,.65); }
  }

  h1 { font: italic 600 42px/1.1 "Fraunces", serif; letter-spacing: .01em; }
  .badge {
    display: inline-block; margin-top: 10px; padding: 4px 12px;
    border: 1px solid rgba(255,227,234,.35); border-radius: 999px;
    font-size: 12px; letter-spacing: .03em; color: var(--blush); opacity: .85;
  }
  .tagline { margin: 14px 0 32px; font: italic 600 25px/1.25 "Fraunces", serif; color: var(--rose); }
  .bio { font-size: 15px; line-height: 1.6; opacity: .88; max-width: 32ch; margin: 0 auto 30px; }

  .links { display: grid; gap: 14px; }
  .links a {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 18px; text-decoration: none; color: var(--blush);
    background: rgba(255,227,234,.09); border: 1px solid rgba(255,227,234,.22);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    text-align: left;
  }
  .links a:hover { transform: translateY(-2px); background: rgba(255,227,234,.16); }
  .links a:focus-visible { outline: 3px solid var(--blush); outline-offset: 3px; }
  .ic {
    flex: none; width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
  }
  .ic svg { width: 24px; height: 24px; }
  .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .txt strong { font-size: 17px; font-weight: 700; }
  .txt small { font-size: 13px; opacity: .78; }
  .arrow { font-size: 20px; opacity: .7; }

  .links a.primary {
    background: linear-gradient(135deg, var(--rose), var(--peach)); border: 0; color: var(--wine);
    box-shadow: 0 10px 30px rgba(255,92,138,.4);
  }
  .links a.primary:hover { box-shadow: 0 14px 36px rgba(255,92,138,.55); }
  .primary .ic { background: rgba(42,12,28,.18); color: var(--wine); }
  .tg .ic { background: #29a9eb; color: #fff; }

  footer { margin-top: 34px; font-size: 12px; line-height: 1.6; opacity: .6; }

  .fade { opacity: 0; transform: translateY(12px); animation: in .6s ease forwards; }
  .d1 { animation-delay: .05s } .d2 { animation-delay: .15s } .d3 { animation-delay: .25s }
  .d4 { animation-delay: .35s } .d5 { animation-delay: .45s }
  @keyframes in { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .fade { animation: none; opacity: 1; transform: none; }
    .avatar-wrap { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="avatar-wrap fade d1">
    <img class="avatar" src="profile.jpg" alt="Aiko Vixen" width="640" height="640">
    <span class="online" aria-hidden="true"></span>
  </div>

  <div class="fade d2">
    <h1>Aiko Vixen</h1>
  </div>

  <div class="fade d3">
    <p class="tagline">Come talk to me, baby 💋</p>
  </div>

  <nav class="links">
    <a class="primary fade d4" href="https://www.fanvue.com/aiko.vixen" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </span>
      <span class="txt"><strong>Fanvue</strong><small>Exclusive content</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <a class="tg fade d5" href="https://t.me/+BMQUUohBoscxMjVk" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.3 13 1.5 11.5c-1-.3-1-1 .2-1.5l18.8-7.2c.9-.3 1.6.2 1.4 1.5z"/></svg>
      </span>
      <span class="txt"><strong>Telegram</strong><small>Join my channel</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>

  <footer>AI model · © 2026 Aiko Vixen</footer>
</main>
</body>
</html>
